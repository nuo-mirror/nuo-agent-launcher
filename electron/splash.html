<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>NUO OS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #0a0e14 0%, #101826 55%, #131f30 100%);
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, #3b82f6, #7c4dff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 10px 32px rgba(59, 130, 246, 0.35);
    animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  }
  .name {
    margin-top: 18px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    animation: fade 0.6s 0.1s both;
  }
  .sub {
    margin-top: 6px;
    font-size: 12px;
    color: #8b98a9;
    letter-spacing: 1px;
    animation: fade 0.6s 0.2s both;
  }
  .bar {
    margin-top: 26px;
    width: 180px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    animation: fade 0.6s 0.3s both;
  }
  .bar::after {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #3b82f6, #7c4dff);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(280%); }
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="logo">N</div>
  <div class="name">NUO OS</div>
  <div class="sub">Minecraft 启动器</div>
  <div class="bar"></div>
</body>
</html>
